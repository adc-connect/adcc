[project]
name = "adcc"
description = "adcc:  Seamlessly connect your host program to ADC"
version = "0.18.0"
dynamic = ["readme"]  # handled in setup.py
keywords = [
	"ADC", "algebraic-diagrammatic", "construction", "excited", "states",
	"electronic", "structure", "computational", "chemistry", "quantum",
	"spectroscopy",
]
authors = [
	{name = "Michael F. Herbst"},
	{name = "Maximilian Scheurer"},
	{name = "Jonas Leitner"},
	{name = "Antonia Papapostolou"},
	{name = "Friederike Schneider"},
	{name = "Adrian L. Dempwolff"},
	{name = "Adrian J. Müller"},
	{email = "developers@adc-connect.org"},
]
license = "GPL-3.0-or-later"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Chemistry",
	"Topic :: Education",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Operating System :: MacOS :: MacOS X",
	"Operating System :: POSIX :: Linux",
]
requires-python = ">= 3.10"
dependencies = [
	"opt_einsum >= 3.0",
	"numpy >= 2.0",
	"scipy >= 1.2",
	"h5py >= 2.9",
	"tqdm >= 4.30",
	"packaging >=24.0",
]

[project.optional-dependencies]
tests = ["pytest", "pandas >= 0.25.0"]
coverage = ["pytest-cov"]
# building the tests requires the same dependencies as building libadcc
# since we explicity call setup.py
cpptest = [
	"setuptools >= 77.0",
	"pybind11 >= 3.0"
]
build_docs = [
	"sphinx>=2", "breathe", "sphinxcontrib-bibtex",
	"sphinx-automodapi", "sphinx-rtd-theme"
]
analysis = ["matplotlib >= 3.0", "pandas >= 0.25.0"]
# the stub is formatted through pre-commit, which uses the pinned ruff version
build_stub = ["pre-commit", "pybind11-stubgen"]
# ruff and clang-format are not listed here on purpose: pre-commit installs them
# itself in the versions pinned in .pre-commit-config.yaml.
lint = ["pre-commit"]
dev = ["adcc[tests,cpptest,lint]"]

[project.urls]
Homepage = "https://adc-connect.org"
"Source Code" = "https://github.com/adc-connect/adcc"
"Issue Tracker" = "https://github.com/adc-connect/adcc/issues"

[build-system]
requires = [
	"setuptools >= 77.0",  # due to license
	"pybind11 >= 3.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = [
	"examples*", "docs*", "scripts*"
]

[tool.bumpversion]
current_version = "0.18.0"
commit = true
tag = true
files = [
	{filename = "adcc/__init__.py"}
]

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["adcc/tests"]

[tool.ruff]
line-length = 100
# extend-exclude adds to ruff's defaults (.git, build, dist, ...)
extend-exclude = [
	"examples/water/data.py",
	"*.ipynb",
]

[tool.ruff.lint]
# - N999: The module files share the name of the class they define, e.g.
#   `AdcMatrix` in `AdcMatrix.py`. In python usually snake_case
#   `adc_matrix.py` is used for module names and thus ruff is not happy.
#    However, renaming them would break downstream code.
# - E265: no space after block comment. Fires for all the license
#   headers since they start with '##'
# - E266: comment with multiple leading '#'. Fires for the license headers.
ignore = ["N999", "E265", "E266"]
# Q: prefer double quotes
# E + W: white-space rules
# Mostly preview only rules that are usually handled by ruff format.
# However, in `fmt: skip` blocks (equations) we want the linter to enforce them.
extend-select=["Q", "E", "W"]
preview = true

[tool.ruff.lint.per-file-ignores]
# libadcc.pyi is automatically generated. Ignores:
# - `Self` not used as return type
# - Docstrings might be too long
"libadcc.pyi" = ["PYI034", "E501"]
