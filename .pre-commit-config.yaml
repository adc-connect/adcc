# update the pinned versions by running:
# pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        # run on all C++ files in "libadcc_src/" with a ".cc" or ".hh" suffix
        types_or: [c++]
        files: ^libadcc_src/.*\.(cc|hh)$
